name: Deploy wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "step_9_site/hebrew_search.py"
      - "step_9_site/agent_hook.py"
      - "wrangler.jsonc"
      - "worker/**"
      - "config.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.5.0"
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install, type-check and test the MCP Worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test
      # wrangler.jsonc build.command writes site/wiki_search.json before the upload.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.0"
